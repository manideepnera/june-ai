<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>June AI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0a0a;
      --surface: #111111;
      --line:    #1e1e1e;
      --muted:   #3a3a3a;
      --sub:     #666666;
      --text:    #c0c0c0;
      --bright:  #e8e8e8;
      --mono:    'DM Mono', monospace;
      --sans:    'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      height: 52px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      gap: 10px;
    }

    .logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 400;
      color: var(--bright);
      letter-spacing: 0.04em;
    }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--muted);
      margin-left: 2px;
    }
    .dot.live {
      background: #e8e8e8;
      animation: breathe 3s ease-in-out infinite;
    }
    .dot.offline { background: var(--muted); }

    @keyframes breathe {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    #reset-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--sub);
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s;
    }
    #reset-btn:hover { color: var(--text); }

    /* ── CHAT ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 2px; }
    #chat::-webkit-scrollbar-thumb { background: var(--line); }

    /* Welcome */
    #welcome {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: rise 0.5s ease both;
    }

    #welcome .w-title {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--bright);
      letter-spacing: 0.06em;
    }

    #welcome .w-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      letter-spacing: 0.06em;
    }

    /* Messages */
    .message {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 680px;
      animation: rise 0.2s ease both;
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .bubble {
      font-size: 14px;
      line-height: 1.75;
      font-weight: 300;
    }

    .message.june .bubble { color: var(--text); }

    .message.user .bubble {
      color: var(--bright);
    }

    /* Thinking */
    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }

    .thinking span {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--muted);
      animation: tpulse 1.4s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes tpulse {
      0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
      40%          { opacity: 1;   transform: scale(1.1); }
    }

    /* ── FOOTER ── */
    footer {
      padding: 16px 32px 24px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    #input {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      color: var(--bright);
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 300;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.6;
      transition: border-color 0.2s;
    }

    #input:focus { border-color: var(--sub); }

    #input::placeholder {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    #send-btn {
      background: none;
      border: none;
      padding: 0 0 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: opacity 0.15s;
      opacity: 0.35;
    }

    #send-btn:hover:not(:disabled) { opacity: 1; }
    #send-btn:disabled { opacity: 0.15; cursor: not-allowed; }

    #send-btn svg {
      width: 15px; height: 15px;
      fill: var(--bright);
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">june</span>
    <div class="dot live" id="status-dot"></div>
    <div class="header-right">
      <span class="header-label" id="status-label">ready</span>
      <button id="reset-btn">clear</button>
    </div>
  </header>

  <div id="chat">
    <div id="welcome">
      <span class="w-title">june_ai</span>
      <span class="w-sub">ask me anything</span>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea
        id="input"
        placeholder="message..."
        rows="1"
      ></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </footer>

  <script>
    const chatEl    = document.getElementById("chat");
    const inputEl   = document.getElementById("input");
    const sendBtn   = document.getElementById("send-btn");
    const resetBtn  = document.getElementById("reset-btn");
    const statusDot = document.getElementById("status-dot");
    const statusLbl = document.getElementById("status-label");

    let ws = null;
    let isStreaming = false;

    function connect() {
      ws = new WebSocket("ws://localhost:8000/api/ws");
      ws.onopen  = () => { statusDot.classList.add("live"); statusLbl.textContent = "ready"; };
      ws.onclose = () => { statusDot.classList.remove("live"); statusDot.classList.add("offline"); statusLbl.textContent = "offline"; setTimeout(connect, 3000); };
      ws.onerror = () => { statusLbl.textContent = "error"; };
      ws.onmessage = ({ data }) => {
        if (data === "[DONE]") {
          isStreaming = false;
          sendBtn.disabled = false;
          inputEl.disabled = false;
          inputEl.focus();
          return;
        }
        appendChunk(data);
      };
    }

    connect();

    function removeWelcome() {
      const w = document.getElementById("welcome");
      if (w) w.remove();
    }

    function addMessage(role, text = "") {
      removeWelcome();
      const msg = document.createElement("div");
      msg.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = role === "june" ? "june" : "you";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      msg.appendChild(label);
      msg.appendChild(bubble);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    function showThinking() {
      const msg = document.createElement("div");
      msg.className = "message june";
      msg.id = "thinking";
      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = "june";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
      msg.appendChild(label);
      msg.appendChild(bubble);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    let currentBubble = null;

    function startJuneMessage() {
      const t = document.getElementById("thinking");
      if (t) t.remove();
      const msg = document.createElement("div");
      msg.className = "message june";
      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = "june";
      currentBubble = document.createElement("div");
      currentBubble.className = "bubble";
      msg.appendChild(label);
      msg.appendChild(currentBubble);
      chatEl.appendChild(msg);
    }

    function appendChunk(chunk) {
      if (!currentBubble) startJuneMessage();
      currentBubble.textContent += chunk;
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;
      addMessage("user", text);
      showThinking();
      currentBubble = null;
      isStreaming = true;
      sendBtn.disabled = true;
      inputEl.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "42px";
      ws.send(text);
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "42px";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    resetBtn.addEventListener("click", async () => {
      try { await fetch("http://localhost:8000/api/reset", { method: "POST" }); } catch {}
      chatEl.innerHTML = `<div id="welcome"><span class="w-title">june_ai</span><span class="w-sub">ask me anything</span></div>`;
      currentBubble = null;
    });
  </script>
</body>
</html>
